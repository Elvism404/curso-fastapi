<!DOCTYPE html>
<html lang="es">
<head>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 h-screen flex items-center justify-center">
  <div class="bg-white p-6 rounded-lg shadow-md w-96">
    <h1 class="text-xl font-bold mb-4">Mi Tutor IA</h1>
    <input id="pregunta" class="border p-2 w-full rounded" placeholder="Escribe tu pregunta">
    <button class="bg-blue-500 text-white mt-3 p-2 w-full rounded">Preguntar</button>
    <p id="respuesta" class="mt-4 text-gray-700 max-h-60 overflow-y-auto"></p>
  </div>

  <script>
  document.querySelector("button").onclick = async () => {
    const boton = document.querySelector("button");
    boton.disabled = true;
    document.getElementById("respuesta").innerText = "";
    const pregunta = document.getElementById("pregunta").value;
    const res = await fetch("http://127.0.0.1:8000/preguntar", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({pregunta})
    });
    const lector = res.body.getReader();
    const decodificador = new TextDecoder();
    while (true) {
      const {done, value} = await lector.read();
      if (done) break;
      document.getElementById("respuesta").innerText += decodificador.decode(value);
    }
    boton.disabled = false;
  };
  </script>
</body>
</html>
